<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Major Dude Media | Organizer</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head>
<body><div class="stripe"></div><main>
<header><div class="pre">Major Dude Media</div><h1>Organizer <span>Panel</span></h1></header>
<div class="c"><input id="adm" type="password" placeholder="Organizer passcode"><button onclick="unlock()">Unlock</button></div>
<div id="panel" style="display:none">
<div class="c"><b>Theme for the month</b><small>Leave it empty and each draw picks a random theme.</small>
<input id="tl" placeholder="Month (optional), e.g. October"><input id="tm" placeholder="Theme, e.g. 90s thrillers" maxlength="120">
<button onclick="theme(true)">Save theme</button><button class="o" onclick="theme(false)">Clear theme</button></div>
<div class="c"><b>Draw</b><button onclick="run('draw','Draw a movie and email everyone?')">&#127922; Draw a movie</button><div id="latest"></div></div>
<div class="c"><b>Watch details (latest pick)</b><small>Saving emails everyone the date and place.</small>
<input id="wh" type="datetime-local"><input id="wp" placeholder="Where, e.g. Sam's place" maxlength="120">
<button onclick="details()">Save &amp; email details</button></div>
<div class="c"><b>Pool</b><div id="pool"></div></div>
<div class="c"><b>Clear</b><small>Start fresh for a new round.</small><br>
<button class="o" onclick="clr('pool')">Clear the pool (keep past picks and emails)</button>
<button class="o" onclick="clr('all')">Clear everything</button></div></div>
<p class="foot"><a class="quiet" href="/">Back to the club</a></p></main><div class="stripe"></div>
<script src="/ui.js"></script>
<script>
let key = '';
try { key = sessionStorage.getItem('ak') || ''; } catch (e) {}
if (key) { $('adm').value = key; unlock(); }
const post = (b) => api({ ...b, adminKey: key });
async function unlock() {
  key = $('adm').value; const d = await post({ action: 'check' }); if (!d) return;
  try { sessionStorage.setItem('ak', key); } catch (e) {}
  $('panel').style.display = 'block'; show(d, true);
}
function show(d, fill) {
  const p = d.picks[0], e = Object.entries(d.suggestions);
  if (fill) { $('tm').value = d.theme ? d.theme.text : ''; $('tl').value = d.theme ? d.theme.month : ''; $('wh').value = p?.when || ''; $('wp').value = p?.where || ''; }
  $('pool').innerHTML = e.length ? e.map(([n, v]) => `<div class="r">${img(v.movie)}<span class="g ${v.picked ? 'd' : ''}">${esc(v.title)} <small>${esc(v.movie?.year || '')} &middot; ${esc(n)}${v.seen?.length ? ' &middot; seen by ' + esc(v.seen.join(', ')) : ''}</small>${v.note ? `<br><small>&ldquo;${esc(v.note)}&rdquo;</small>` : ''}</span><button class="o sm" data-rm="${esc(n)}">Remove</button></div>`).join('') : '<small>Empty.</small>';
  $('latest').innerHTML = p ? `<p>Latest: <b>${esc(p.title)}</b> (by ${esc(p.by)})<br><small>Theme: ${esc(p.theme)}${avg(p) ? ' &middot; rated ' + avg(p).toFixed(1) : ''}</small></p>` : '';
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-rm]'); if (!b || !confirm('Remove ' + b.dataset.rm + "'s suggestion?")) return;
  const d = await post({ action: 'remove', name: b.dataset.rm }); if (d) show(d);
});
async function run(action, ask) {
  if (!confirm(ask)) return; const d = await post({ action }); if (!d) return;
  if (d.latest) alert(d.latest.emailed ? 'Drawn! Everyone was emailed.' : 'Drawn! (No email sent)'); show(d, true);
}
async function theme(save) { const d = await post({ action: 'settheme', theme: save ? $('tm').value : '', month: $('tl').value }); if (d) { show(d, true); alert(save ? 'Theme saved.' : 'Theme cleared.'); } }
async function details() { const d = await post({ action: 'details', when: $('wh').value, where: $('wp').value }); if (d) { show(d); alert(d.emailed ? 'Saved and emailed.' : 'Saved (no email sent).'); } }
async function clr(scope) { if (!confirm(scope === 'all' ? 'Delete ALL suggestions, past picks and emails?' : 'Clear the pool?')) return; const d = await post({ action: 'clear', scope }); if (d) show(d, true); }
</script></body></html>
