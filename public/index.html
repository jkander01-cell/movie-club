<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Major Dude Media | A Movie Club</title>
<meta name="description" content="A movie club for people who want to watch more movies with friends.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head>
<body><div class="stripe"></div><main>
<header><div class="pre">A Movie Club</div><h1>Major Dude <span>Media</span></h1>
<p class="tag">A movie club for people who want to watch more movies with friends.</p><div class="orn">&#10022; &#10022; &#10022;</div></header>
<div class="c" id="th"></div>
<div class="c ticket" id="pk"></div>
<div class="c"><b>Your Suggestion</b>
<input id="code" placeholder="Club code"><input id="name" placeholder="Your name"><input id="email" placeholder="Email (for the pick announcement)">
<input id="q" placeholder="Search for a movie..." autocomplete="off"><div id="res"></div><div id="sel"></div>
<textarea id="note" rows="2" placeholder="Why this one? (optional)"></textarea>
<button onclick="submitMovie()">Submit</button></div>
<div class="c"><b>The Itinerary</b><div id="pool"></div></div>
<div class="c"><b>Past Screenings</b><div id="past"></div></div>
<p class="foot">Movie data from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
</main><div class="stripe"></div>
<script src="/ui.js"></script>
<script>
let chosen = null, found = [], t;
['code', 'name', 'email'].forEach((k) => { $(k).value = store(k); });
const who = () => ({ code: $('code').value, name: $('name').value.trim() });
const remember = () => ['code', 'name', 'email'].forEach((k) => store(k, $(k).value));

// Movie search
$('q').addEventListener('input', () => {
  chosen = null; $('sel').innerHTML = ''; clearTimeout(t);
  const v = $('q').value.trim();
  if (v.length < 2) { $('res').innerHTML = ''; return; }
  t = setTimeout(async () => {
    try {
      found = await (await fetch('/api/search?q=' + encodeURIComponent(v))).json();
      $('res').innerHTML = Array.isArray(found) ? found.map((m, i) => `<div class="r" data-pick="${i}">${img(m)}<div class="g"><b>${esc(m.title)}</b> <small>${esc(m.year)}</small><br><small>${esc(m.overview.slice(0, 90))}${m.overview.length > 90 ? '...' : ''}</small></div></div>`).join('') : '';
    } catch (e) {}
  }, 300);
});

// Clicks (event delegation so rows can be re-rendered freely)
document.addEventListener('click', async (e) => {
  const el = e.target.closest('[data-pick],[data-seen],[data-rate]');
  if (!el) return;
  if (el.dataset.pick !== undefined) {
    chosen = found[el.dataset.pick]; $('q').value = chosen.title; $('res').innerHTML = '';
    $('sel').innerHTML = `<div class="sel r">${img(chosen)}<div class="g"><b>${esc(chosen.title)}</b> <small>${esc(chosen.year)}</small><br><small>${esc(chosen.overview)}</small></div></div>`;
  } else if (el.dataset.seen !== undefined) {
    remember(); const d = await api({ action: 'seen', owner: el.dataset.seen, ...who() }); if (d) show(d);
  } else {
    remember(); const score = document.querySelector(`[data-sel="${el.dataset.rate}"]`).value;
    const d = await api({ action: 'rate', pick: +el.dataset.rate, score, ...who() }); if (d) show(d);
  }
});

async function submitMovie() {
  const title = chosen ? chosen.title : $('q').value.trim();
  remember();
  const d = await api({ action: 'suggest', ...who(), email: $('email').value.trim(), title, movie: chosen, note: $('note').value.trim() });
  if (!d) return;
  $('q').value = ''; chosen = null; $('sel').innerHTML = ''; $('note').value = ''; show(d);
}

async function load() { show(await (await fetch('/api/club')).json()); }

function show(d) {
  $('th').innerHTML = d.theme ? `<span class="ch">${d.theme.month ? esc(d.theme.month) + ' Theme' : "This Month's Theme"}</span><h2>${esc(d.theme.text)}</h2>` : '';
  const p = d.picks[0], m = p && p.movie;
  $('pk').innerHTML = p
    ? `<span class="ch">Now Showing</span>${img(m, 'big')}<h2 style="text-align:left">${esc(p.title)} <small>${esc(m?.year || '')}</small></h2><small>suggested by ${esc(p.by)}</small>
      ${p.note ? `<p><i>&ldquo;${esc(p.note)}&rdquo;</i></p>` : ''}<p><b>Theme:</b> ${esc(p.theme)}</p>
      ${p.when ? `<p><b>When:</b> ${esc(new Date(p.when).toLocaleString([], { dateStyle: 'full', timeStyle: 'short' }))}${p.where ? ` &middot; <b>Where:</b> ${esc(p.where)}` : ''} &middot; <a href="${esc(gcal(p))}" target="_blank">Add to calendar</a></p>` : ''}
      <div id="info"></div>${p.questions?.length ? `<p><b>Talk about afterward:</b></p><ul>${p.questions.map((q) => `<li>${esc(q)}</li>`).join('')}</ul>` : ''}<div class="cl"></div>`
    : '<span class="ch">Now Showing</span><p style="text-align:center">Nothing is screening yet. Add your suggestion!</p>';
  if (m && m.id) info(m.id);
  const me = $('name').value.trim(), e = Object.entries(d.suggestions);
  $('pool').innerHTML = (e.length ? e.map(([n, v]) => `<div class="r">${img(v.movie)}<span class="g ${v.picked ? 'd' : ''}">${esc(v.title)} <small>${esc(v.movie?.year || '')} &middot; ${esc(n)}</small></span>${v.picked ? '' : `<button class="o sm" data-seen="${esc(n)}">${(v.seen || []).includes(me) ? '&#10003; ' : ''}Seen it${v.seen?.length ? ' (' + v.seen.length + ')' : ''}</button>`}</div>`).join('') : '<small>Empty so far.</small>') + `<small>${e.length} submitted. Movies lots of people have seen are less likely to be drawn.</small>`;
  const rated = d.picks.filter((x) => avg(x) !== null), best = rated.sort((a, b) => avg(b) - avg(a))[0];
  $('past').innerHTML = d.picks.length
    ? `<div class="stats">${d.picks.length} watched${rated.length ? ` &middot; top rated: ${esc(best.title)} (${avg(best).toFixed(1)})` : ''}</div>` + d.picks.map((x) => { const a = avg(x); return `<div class="r">${img(x.movie)}<div class="g"><b>${esc(x.title)}</b> <small>${esc(x.movie?.year || '')} &middot; ${new Date(x.at).toLocaleDateString()} &middot; ${esc(x.theme)}</small><br>${a ? `<span class="sc">&#9733; ${a.toFixed(1)}</span> <small>(${Object.keys(x.ratings).length} ratings)</small>` : '<small>Not rated yet</small>'}</div><select data-sel="${x.at}">${[...Array(10)].map((_, i) => `<option${i === 7 ? ' selected' : ''}>${i + 1}</option>`).join('')}</select><button class="o sm" data-rate="${x.at}">Rate</button></div>`; }).join('')
    : '<small>Nothing watched yet.</small>';
}

async function info(id) {
  try {
    const d = await (await fetch('/api/movie?id=' + id)).json(), el = $('info');
    if (!el) return;
    el.innerHTML = `<p>${d.runtime ? d.runtime + ' min &middot; ' : ''}${d.streaming?.length ? '<b>Streaming:</b> ' + esc(d.streaming.join(', ')) : 'Not on subscription streaming'}${d.rent?.length ? ' &middot; <b>Rent:</b> ' + esc(d.rent.join(', ')) : ''}${d.trailer ? ` &middot; <a href="${esc(d.trailer)}" target="_blank">Trailer</a>` : ''}</p>`;
  } catch (e) {}
}
load();
</script></body></html>
